# Most recent first. Each entry renders as "(id): [link labels]" followed by
# authors, title, and venue. `venue` needs its own leading preposition (e.g.
# "In Journal Name, ..."). Delete `links` entries you don't have.
- id: R-3
  authors: "Author One, Author Two"
  title: "Paper title goes here"
  venue: "In Journal or Conference Name, vol:pages, 2026"
  links:
    - { label: pdf, url: "#" }
    - { label: code, url: "#" }

- id: R-2
